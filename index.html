<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RIVA</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { font-family: "Cormorant Garamond", "EB Garamond", Georgia, "Times New Roman", serif; color: #fff; }
  #app canvas { display: block; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(to bottom, rgba(40,28,40,.55), rgba(240,160,140,.25) 70%, rgba(20,20,30,.5)); cursor: pointer; transition: opacity 1.2s; }
  #start.hidden { opacity: 0; pointer-events: none; }
  #start h1 { font-weight: 300; font-size: clamp(48px, 11vw, 120px); letter-spacing: .5em; margin: 0 0 0 .5em; text-shadow: 0 0 40px rgba(255,200,170,.5); }
  #start .sub { font-style: italic; opacity: .85; font-size: clamp(16px, 2.4vw, 22px); margin-top: .4em; letter-spacing: .1em; }
  #start .cta { margin-top: 3em; font-size: 15px; letter-spacing: .35em; text-transform: uppercase; opacity: .9; animation: breathe 3s ease-in-out infinite; }
  #start .keys { position: absolute; bottom: 5vh; font-size: 13px; letter-spacing: .12em; opacity: .7; text-align: center; line-height: 1.9; font-family: system-ui, sans-serif; font-weight: 300; padding: 0 20px; }
  @keyframes breathe { 50% { opacity: .35; } }
  .hud { position: fixed; pointer-events: none; opacity: 0; transition: opacity 2s; text-shadow: 0 0 12px rgba(0,0,0,.35); }
  .hud.on { opacity: 1; }
  #phase { top: 28px; left: 32px; font-size: 20px; font-style: italic; letter-spacing: .2em; }
  #count { bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 16px; letter-spacing: .3em; font-family: system-ui, sans-serif; font-weight: 300; }
  #msg { top: 42%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(20px, 3.2vw, 32px); font-style: italic; letter-spacing: .06em; text-align: center; width: 90vw; }
  #touch.hidden { display: none; }
  #stick { position: fixed; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #stick.on { opacity: 1; }
  .tbtn { position: fixed; right: 24px; width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.08);
    color: #fff; font-size: 13px; letter-spacing: .1em; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #jumpBtn { bottom: 32px; } #timeBtn { bottom: 108px; } #bookBtn { bottom: 184px; }
  #journal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(12,10,16,.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .8s; }
  #journal.open { opacity: 1; pointer-events: auto; }
  #journal .page { width: min(560px, 86vw); max-height: 80vh; overflow: auto; padding: 36px 40px; border: 1px solid rgba(255,255,255,.18);
    background: linear-gradient(to bottom, rgba(255,240,230,.07), rgba(255,255,255,.02)); }
  #journal h2 { font-weight: 300; font-style: italic; letter-spacing: .2em; margin: 0 0 22px; font-size: 22px; }
  #journalList { list-style: none; padding: 0; margin: 0; }
  #journalList li { margin: 0 0 18px; line-height: 1.5; }
  #journalList .pl { display: block; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; opacity: .55; font-family: system-ui, sans-serif; font-weight: 300; margin-bottom: 4px; }
  #journalList .tx { font-size: 19px; font-style: italic; }
  #journalList li.miss { opacity: .4; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app"></div>
<div id="start">
  <h1>RIVA</h1>
  <div class="sub">una spiaggia fuori dal tempo</div>
  <div class="cta">Clicca per entrare</div>
  <div class="keys">WASD / frecce — cammina · Mouse — guarda · Shift — corri · Spazio — salta<br>T — cambia l'ora del giorno · J — diario · M — audio<br>Il mare regge i tuoi passi. Segui la bandiera, o le impronte.</div>
</div>
<div id="phase" class="hud"></div>
<div id="count" class="hud"></div>
<div id="msg" class="hud"></div>
<div id="journal"><div class="page"><h2>Diario della riva</h2><ul id="journalList"></ul></div></div>
<div id="touch" class="hidden">
  <div id="bookBtn" class="tbtn">DIARIO</div>
  <div id="stick"></div>
  <div id="timeBtn" class="tbtn">ORA</div>
  <div id="jumpBtn" class="tbtn">SALTA</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
